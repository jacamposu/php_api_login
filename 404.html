<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Error 404 - Página no encontrada</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 6em;
      margin: 0;
      color: #ff6b6b;
      animation: pulse 2s infinite;
    }
    h2 {
      margin-top: 10px;
      font-size: 2em;
      font-weight: 400;
    }
    p {
      margin: 20px 0;
      font-size: 1.2em;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #ff6b6b;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #ff3b3b;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>Lo sentimos, la URL que intentas visitar no existe o fue movida.</p>
  </div>
</body>
</html>
